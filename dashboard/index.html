<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foresight Factory — Live Dashboard</title>
<style>
  :root {
    --bg:#0c1118; --panel:#151c26; --panel2:#1a2331;
    --accent:#ff7e3a; --accent2:#38c1ff; --tier0:#ff7e3a;
    --tier1:#38c1ff; --tier2:#b388ff; --tier3:#66e7a4;
    --ok:#66e7a4; --warn:#ffd166; --err:#ef476f;
    --text:#e6ebf2; --muted:#8aa0b4; --border:rgba(255,255,255,0.08);
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font:14px -apple-system, BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  header {
    padding:14px 24px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:16px;
    background:linear-gradient(180deg, rgba(255,126,58,0.06), transparent);
  }
  header h1 { margin:0; font-size:18px; font-weight:600; letter-spacing:-0.01em; }
  header .subtitle { color:var(--muted); font-size:12px; }
  header .right { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .badge {
    padding:2px 8px; border-radius:999px; font-size:11px;
    background:rgba(56,193,255,0.15); color:var(--accent2);
    font-family:"SF Mono",Menlo,monospace;
  }
  .badge.warn { background:rgba(255,209,102,0.15); color:var(--warn); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--err); display:inline-block; }
  .dot.ok { background:var(--ok); }

  .grid {
    display:grid; grid-template-columns: 1fr 380px;
    gap:16px; padding:16px 24px;
  }
  .panel {
    background:var(--panel); border:1px solid var(--border);
    border-radius:12px; padding:14px 16px;
  }
  .panel h2 {
    margin:0 0 10px; font-size:13px; font-weight:600; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--muted);
  }

  /* pipeline stages */
  .stages { display:flex; gap:6px; align-items:stretch; }
  .stage {
    flex:1; padding:10px 8px; text-align:center;
    background:var(--panel2); border-radius:8px;
    border-top:3px solid var(--accent2); cursor:default;
    transition:all 0.2s;
  }
  .stage .n { font-size:22px; font-weight:700; }
  .stage .lbl { font-size:11px; color:var(--muted); margin-top:2px;
    text-transform:uppercase; letter-spacing:0.05em; }
  .stage.pulse { animation:pulse 0.6s; }
  @keyframes pulse {
    0% { transform:scale(1); box-shadow:0 0 0 rgba(56,193,255,0); }
    50% { transform:scale(1.04); box-shadow:0 0 18px rgba(56,193,255,0.4); }
    100% { transform:scale(1); }
  }
  .arrow { color:var(--accent); font-size:18px; align-self:center; }

  /* insights list */
  .insight {
    background:var(--panel2); border-radius:10px; padding:12px 14px;
    margin-bottom:10px; border-left:3px solid var(--accent);
  }
  .insight h3 { margin:0 0 6px; font-size:14px; font-weight:600; }
  .insight .meta { color:var(--muted); font-size:11px; margin-bottom:8px;
    font-family:"SF Mono",Menlo,monospace; }
  .insight .summary { font-size:13px; line-height:1.4; color:#d6deea; }
  .insight .actions { margin-top:10px; display:flex; gap:8px; }
  .btn {
    background:var(--accent); color:#1a1a1a; border:0;
    padding:6px 12px; border-radius:6px; font-weight:600; cursor:pointer;
    font-size:12px;
  }
  .btn:hover { filter:brightness(1.1); }
  .btn.secondary {
    background:transparent; color:var(--accent2); border:1px solid var(--accent2);
  }
  .insight.approved { border-left-color:var(--ok); opacity:0.7; }
  .insight.published { border-left-color:var(--tier3); }
  .pill {
    display:inline-block; padding:1px 6px; border-radius:4px;
    font-size:10px; font-family:"SF Mono",Menlo,monospace;
    background:rgba(255,255,255,0.08); margin-right:4px;
  }

  /* event stream */
  .stream {
    height:calc(100vh - 220px); overflow-y:auto; font-family:"SF Mono",Menlo,monospace;
    font-size:11px;
  }
  .ev {
    padding:6px 8px; border-bottom:1px solid var(--border);
    line-height:1.4;
  }
  .ev .t { color:var(--muted); font-size:10px; }
  .ev .topic { color:var(--accent2); font-weight:600; }
  .ev .topic.signal\.created { color:#9aa6b8; }
  .ev .topic.signal\.enriched { color:#a9b2c2; }
  .ev .topic.signal\.scored   { color:#38c1ff; }
  .ev .topic.cluster\.updated { color:#b388ff; }
  .ev .topic.insight\.created { color:#ff7e3a; }
  .ev .topic.insight\.approved{ color:#66e7a4; }
  .ev .topic.product\.published{ color:#66e7a4; font-weight:700; }
  .ev .topic.agent\.error     { color:#ef476f; }
  .ev .topic.policy\.pass     { color:#66e7a4; }
  .ev .topic.policy\.block    { color:#ef476f; }
  .ev .agent { color:var(--muted); }
  .ev .pl { color:#cfd6e0; }

  /* agents bar */
  .agents-row { display:flex; flex-wrap:wrap; gap:6px; }
  .agent-chip {
    padding:4px 10px; border-radius:999px; font-size:11px;
    background:rgba(255,255,255,0.04); border:1px solid var(--border);
    font-family:"SF Mono",Menlo,monospace;
  }
  .agent-chip.t0 { color:var(--tier0); border-color:rgba(255,126,58,0.4); }
  .agent-chip.t1 { color:var(--tier1); border-color:rgba(56,193,255,0.4); }
  .agent-chip.t2 { color:var(--tier2); border-color:rgba(179,136,255,0.4); }
  .agent-chip.t3 { color:var(--tier3); border-color:rgba(102,231,164,0.4); }

  .toolbar { display:flex; gap:8px; margin-bottom:12px; }
  .toolbar input {
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    padding:6px 10px; border-radius:6px; font:inherit; flex:1;
  }

  .empty { color:var(--muted); font-size:12px; text-align:center; padding:20px; }

  .modal {
    position:fixed; inset:0; background:rgba(0,0,0,0.6);
    display:none; align-items:center; justify-content:center; z-index:50;
  }
  .modal.open { display:flex; }
  .modal .inner {
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    max-width:760px; max-height:80vh; overflow-y:auto; padding:24px; width:90%;
  }
  .modal pre { white-space:pre-wrap; font:13px/1.5 -apple-system, sans-serif; }
  .close { float:right; cursor:pointer; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>🏭 Foresight Factory</h1>
  <div class="subtitle">live event stream · agent factory prototype</div>
  <div class="right">
    <span id="llm-badge" class="badge">llm: …</span>
    <span class="badge"><span id="ws-dot" class="dot"></span> <span id="ws-state">connecting…</span></span>
    <button class="btn secondary" onclick="trigger()">▶ Trigger ingestion</button>
  </div>
</header>

<div class="grid">
  <div>
    <div class="panel">
      <h2>Pipeline stages</h2>
      <div id="stages" class="stages"></div>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2>Active agents</h2>
      <div id="agents" class="agents-row"></div>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2>Insights queue · click an insight to read · approve to publish</h2>
      <div class="toolbar">
        <input type="text" id="filter" placeholder="filter by title / cluster / status…" oninput="renderInsights()">
      </div>
      <div id="insights"></div>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2>Published products</h2>
      <div id="products"></div>
    </div>
  </div>

  <div>
    <div class="panel">
      <h2>Live event stream</h2>
      <div id="stream" class="stream"></div>
    </div>
  </div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="inner">
    <span class="close" onclick="closeModal()">✕</span>
    <pre id="modal-body"></pre>
  </div>
</div>

<script>
const STAGES = [
  {key:"signal",    label:"Signal"},
  {key:"enriched",  label:"Enriched"},
  {key:"scored",    label:"Scored"},
  {key:"clustered", label:"Clustered"},
  {key:"insight",   label:"Insight"},
  {key:"approved",  label:"Approved"},
  {key:"published", label:"Published"},
];

let state = { insights: [], products: [], agents: [] };

function renderStages(counts){
  const el = document.getElementById('stages');
  el.innerHTML = STAGES.map((s, i) => `
    ${i>0 ? '<span class="arrow">→</span>' : ''}
    <div class="stage" data-stage="${s.key}">
      <div class="n">${counts[s.key] || 0}</div>
      <div class="lbl">${s.label}</div>
    </div>
  `).join('');
}

function tierFor(name){
  if (name.startsWith('a')) return 't0';
  if (name.startsWith('b')) return 't1';
  if (name.startsWith('c')) return 't2';
  if (name.startsWith('pod')) return 't3';
  return '';
}

function renderAgents(){
  document.getElementById('agents').innerHTML = state.agents
    .map(a => `<span class="agent-chip ${tierFor(a.name)}">${a.name}<span style="color:var(--muted)"> v${a.version}</span></span>`)
    .join('');
}

function renderInsights(){
  const filter = (document.getElementById('filter').value || '').toLowerCase();
  const list = state.insights.filter(i =>
    !filter || i.title.toLowerCase().includes(filter)
    || i.status.includes(filter) || (i.cluster_id||'').includes(filter)
  );
  if (!list.length){
    document.getElementById('insights').innerHTML = '<div class="empty">No insights yet. Trigger ingestion above.</div>';
    return;
  }
  document.getElementById('insights').innerHTML = list.map(i => `
    <div class="insight ${i.status}">
      <h3 onclick="openInsight('${i.id}')" style="cursor:pointer">${i.title}</h3>
      <div class="meta">
        <span class="pill">${i.id}</span>
        <span class="pill">status: ${i.status}</span>
        <span class="pill">conf: ${i.confidence}</span>
        <span class="pill">horizon: ${i.time_horizon}</span>
        <span class="pill">${(i.evidence||[]).length} citations</span>
      </div>
      <div class="summary">${i.exec_summary}</div>
      <div class="actions">
        ${i.status === 'draft' ? `<button class="btn" onclick="approve('${i.id}')">Approve →</button>` : ''}
        <button class="btn secondary" onclick="openInsight('${i.id}')">View detail</button>
      </div>
    </div>
  `).join('');
}

function renderProducts(){
  if (!state.products.length){
    document.getElementById('products').innerHTML = '<div class="empty">No products published yet.</div>';
    return;
  }
  document.getElementById('products').innerHTML = state.products.map(p => `
    <div class="insight published">
      <h3 onclick="openProduct('${p.id}')" style="cursor:pointer">${p.title}</h3>
      <div class="meta">
        <span class="pill">${p.id}</span>
        <span class="pill">${p.kind}</span>
        <span class="pill">${new Date(p.published_at).toLocaleString()}</span>
      </div>
      <div class="summary" style="color:var(--muted); font-size:12px">${p.path}</div>
    </div>
  `).join('');
}

function pushEvent(ev){
  const stream = document.getElementById('stream');
  const div = document.createElement('div');
  div.className = 'ev';
  const t = new Date(ev.ts).toLocaleTimeString();
  const payload = JSON.stringify(ev.payload).slice(0, 80);
  div.innerHTML = `
    <span class="t">${t}</span>
    <span class="topic ${ev.topic}">${ev.topic}</span>
    <span class="agent">← ${ev.agent}</span>
    <div class="pl">${payload}</div>`;
  stream.prepend(div);
  // cap at 200 entries
  while (stream.childNodes.length > 200) stream.removeChild(stream.lastChild);

  // animate the corresponding stage if applicable
  const stageMap = {
    'signal.created':   'signal',
    'signal.enriched':  'enriched',
    'signal.scored':    'scored',
    'cluster.updated':  'clustered',
    'insight.created':  'insight',
    'insight.approved': 'approved',
    'product.published':'published',
  };
  const s = stageMap[ev.topic];
  if (s){
    const el = document.querySelector(`.stage[data-stage="${s}"]`);
    if (el){
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
    }
  }
}

async function refresh(){
  try {
    const [pipeline, insights, products, agents] = await Promise.all([
      fetch('/pipeline').then(r => r.json()),
      fetch('/insights').then(r => r.json()),
      fetch('/products').then(r => r.json()),
      fetch('/agents').then(r => r.json()),
    ]);
    renderStages(pipeline.stages);
    state.insights = insights;
    state.products = products;
    state.agents = agents;
    document.getElementById('llm-badge').textContent = `llm: ${pipeline.llm_mode}`;
    document.getElementById('llm-badge').classList.toggle('warn', pipeline.llm_mode === 'stub');
    renderInsights();
    renderProducts();
    renderAgents();
  } catch (e) {
    console.error('refresh failed', e);
  }
}

async function approve(iid){
  await fetch(`/insights/${iid}/approve?reviewer=dashboard`, { method:'POST' });
  setTimeout(refresh, 300);
}

async function trigger(){
  await fetch('/ingest', { method:'POST' });
  setTimeout(refresh, 800);
}

async function openInsight(iid){
  const i = await fetch(`/insights/${iid}`).then(r => r.json());
  document.getElementById('modal-body').textContent =
    `${i.title}\n\n${'─'.repeat(40)}\n\nWhat happened:\n${i.what_happened}\n\nImplications:\n${i.implications}\n\nUncertainties:\n${i.uncertainties}\n\nRecommended actions:\n${i.recommended_actions.map(a => '  • '+a).join('\n')}\n\nEvidence:\n${i.evidence.map(e=>'  • '+e).join('\n')}\n\n${'─'.repeat(40)}\nID: ${i.id}\nCluster: ${i.cluster_id}\nStatus: ${i.status}\nConfidence: ${i.confidence} · Horizon: ${i.time_horizon}`;
  document.getElementById('modal').classList.add('open');
}

async function openProduct(pid){
  const md = await fetch(`/products/${pid}/raw`).then(r => r.text());
  document.getElementById('modal-body').textContent = md;
  document.getElementById('modal').classList.add('open');
}

function closeModal(){ document.getElementById('modal').classList.remove('open'); }

// websocket for live events
function connect(){
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => {
    document.getElementById('ws-dot').classList.add('ok');
    document.getElementById('ws-state').textContent = 'connected';
  };
  ws.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.type === 'event') {
      pushEvent(msg.data);
      // refresh aggregates after a small delay so we don't thrash
      clearTimeout(window._rt);
      window._rt = setTimeout(refresh, 250);
    }
  };
  ws.onclose = () => {
    document.getElementById('ws-dot').classList.remove('ok');
    document.getElementById('ws-state').textContent = 'reconnecting…';
    setTimeout(connect, 1500);
  };
}

refresh();
connect();
setInterval(refresh, 5000);
</script>
</body>
</html>
